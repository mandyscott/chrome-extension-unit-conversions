<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">

  <!-- Blue rounded background -->
  <rect x="2" y="2" width="124" height="124" rx="22" fill="#7C3AED"/>

  <!-- ── Top ruler (metric, tighter ticks) ── -->
  <rect x="12" y="22" width="104" height="16" rx="3" fill="white"/>
  <!-- major ticks (tall cutouts) -->
  <rect x="12"  y="22" width="2.5" height="11" fill="#7C3AED"/>
  <rect x="32"  y="22" width="2.5" height="11" fill="#7C3AED"/>
  <rect x="52"  y="22" width="2.5" height="11" fill="#7C3AED"/>
  <rect x="72"  y="22" width="2.5" height="11" fill="#7C3AED"/>
  <rect x="92"  y="22" width="2.5" height="11" fill="#7C3AED"/>
  <rect x="113.5" y="22" width="2.5" height="11" fill="#7C3AED"/>
  <!-- minor ticks (short cutouts) -->
  <rect x="22"  y="22" width="1.5" height="7" fill="#7C3AED"/>
  <rect x="42"  y="22" width="1.5" height="7" fill="#7C3AED"/>
  <rect x="62"  y="22" width="1.5" height="7" fill="#7C3AED"/>
  <rect x="82"  y="22" width="1.5" height="7" fill="#7C3AED"/>
  <rect x="102" y="22" width="1.5" height="7" fill="#7C3AED"/>

  <!-- ── Right-pointing arrow (→) ── -->
  <line x1="16" y1="54" x2="92" y2="54" stroke="white" stroke-width="7" stroke-linecap="round"/>
  <polygon points="88,43 88,65 108,54" fill="white"/>

  <!-- ── Left-pointing arrow (←) ── -->
  <line x1="112" y1="74" x2="36" y2="74" stroke="white" stroke-width="7" stroke-linecap="round"/>
  <polygon points="40,63 40,85 20,74" fill="white"/>

  <!-- ── Bottom ruler (imperial, wider ticks) ── -->
  <rect x="12" y="90" width="104" height="16" rx="3" fill="white"/>
  <!-- major ticks – wider spacing than top ruler -->
  <rect x="12"  y="90" width="2.5" height="11" fill="#7C3AED"/>
  <rect x="38"  y="90" width="2.5" height="11" fill="#7C3AED"/>
  <rect x="64"  y="90" width="2.5" height="11" fill="#7C3AED"/>
  <rect x="90"  y="90" width="2.5" height="11" fill="#7C3AED"/>
  <rect x="113.5" y="90" width="2.5" height="11" fill="#7C3AED"/>
  <!-- minor ticks -->
  <rect x="25"  y="90" width="1.5" height="7" fill="#7C3AED"/>
  <rect x="51"  y="90" width="1.5" height="7" fill="#7C3AED"/>
  <rect x="77"  y="90" width="1.5" height="7" fill="#7C3AED"/>
  <rect x="103" y="90" width="1.5" height="7" fill="#7C3AED"/>

</svg>
