<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">

  <!-- Blue rounded background -->
  <rect x="1" y="1" width="46" height="46" rx="9" fill="#5b8dee"/>

  <!-- ── Top ruler (metric, tighter ticks) ── -->
  <rect x="4" y="7" width="40" height="7" rx="1.5" fill="white"/>
  <!-- major ticks -->
  <rect x="4"    y="7" width="1.2" height="5" fill="#5b8dee"/>
  <rect x="11.5" y="7" width="1.2" height="5" fill="#5b8dee"/>
  <rect x="19"   y="7" width="1.2" height="5" fill="#5b8dee"/>
  <rect x="26.5" y="7" width="1.2" height="5" fill="#5b8dee"/>
  <rect x="34"   y="7" width="1.2" height="5" fill="#5b8dee"/>
  <rect x="42.8" y="7" width="1.2" height="5" fill="#5b8dee"/>
  <!-- minor ticks -->
  <rect x="7.75"  y="7" width="0.8" height="3.5" fill="#5b8dee"/>
  <rect x="15.25" y="7" width="0.8" height="3.5" fill="#5b8dee"/>
  <rect x="22.75" y="7" width="0.8" height="3.5" fill="#5b8dee"/>
  <rect x="30.25" y="7" width="0.8" height="3.5" fill="#5b8dee"/>
  <rect x="37.75" y="7" width="0.8" height="3.5" fill="#5b8dee"/>

  <!-- ── Right-pointing arrow (→) ── -->
  <line x1="5" y1="20" x2="33" y2="20" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <polygon points="31,15.5 31,24.5 40,20" fill="white"/>

  <!-- ── Left-pointing arrow (←) ── -->
  <line x1="43" y1="29" x2="15" y2="29" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <polygon points="17,24.5 17,33.5 8,29" fill="white"/>

  <!-- ── Bottom ruler (imperial, wider ticks) ── -->
  <rect x="4" y="34" width="40" height="7" rx="1.5" fill="white"/>
  <!-- major ticks – wider spacing -->
  <rect x="4"    y="34" width="1.2" height="5" fill="#5b8dee"/>
  <rect x="13.5" y="34" width="1.2" height="5" fill="#5b8dee"/>
  <rect x="23"   y="34" width="1.2" height="5" fill="#5b8dee"/>
  <rect x="32.5" y="34" width="1.2" height="5" fill="#5b8dee"/>
  <rect x="42.8" y="34" width="1.2" height="5" fill="#5b8dee"/>
  <!-- minor ticks -->
  <rect x="8.75"  y="34" width="0.8" height="3.5" fill="#5b8dee"/>
  <rect x="18.25" y="34" width="0.8" height="3.5" fill="#5b8dee"/>
  <rect x="27.75" y="34" width="0.8" height="3.5" fill="#5b8dee"/>
  <rect x="37.25" y="34" width="0.8" height="3.5" fill="#5b8dee"/>

</svg>
