<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">

  <!-- Blue rounded background -->
  <rect x="0.5" y="0.5" width="15" height="15" rx="3.5" fill="#5b8dee"/>

  <!-- Tiny top ruler strip -->
  <rect x="2" y="2" width="12" height="3.5" rx="0.8" fill="white"/>
  <rect x="2"   y="2" width="0.9" height="2.5" fill="#5b8dee"/>
  <rect x="5.7" y="2" width="0.9" height="2.5" fill="#5b8dee"/>
  <rect x="9.4" y="2" width="0.9" height="2.5" fill="#5b8dee"/>
  <rect x="13.1" y="2" width="0.9" height="2.5" fill="#5b8dee"/>

  <!-- Right-pointing arrow -->
  <line x1="2" y1="7.5" x2="9.5" y2="7.5" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
  <polygon points="9,5.5 9,9.5 13.5,7.5" fill="white"/>

  <!-- Left-pointing arrow -->
  <line x1="14" y1="11.5" x2="6.5" y2="11.5" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
  <polygon points="7,9.5 7,13.5 2.5,11.5" fill="white"/>

  <!-- Tiny bottom ruler strip -->
  <rect x="2" y="13" width="12" height="3" rx="0.8" fill="white"/>
  <rect x="2"    y="13" width="0.9" height="2.2" fill="#5b8dee"/>
  <rect x="6.7"  y="13" width="0.9" height="2.2" fill="#5b8dee"/>
  <rect x="11.4" y="13" width="0.9" height="2.2" fill="#5b8dee"/>

</svg>
