<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">

  <!-- Purple rounded background -->
  <rect x="0.5" y="0.5" width="15" height="15" rx="3.5" fill="#7C3AED"/>

  <!-- Right-pointing arrow (→) -->
  <rect x="2" y="5.1" width="8" height="1.8" rx="0.9" fill="white"/>
  <polygon points="9,3.3 9,8.7 14,6" fill="white"/>

  <!-- Left-pointing arrow (←) -->
  <rect x="6" y="10.1" width="8" height="1.8" rx="0.9" fill="white"/>
  <polygon points="7,8.3 7,13.7 2,11" fill="white"/>

</svg>
