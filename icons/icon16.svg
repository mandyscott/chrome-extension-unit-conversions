<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">

  <!-- Purple rounded background -->
  <rect x="0" y="0" width="16" height="16" rx="3.5" fill="#7C3AED"/>

  <!-- Right-pointing arrow (→) -->
  <rect x="2" y="3.3" width="8" height="1.8" rx="0.9" fill="white"/>
  <polygon points="9,1.5 9,6.9 14,4.2" fill="white"/>

  <!-- Left-pointing arrow (←) -->
  <rect x="6" y="10.9" width="8" height="1.8" rx="0.9" fill="white"/>
  <polygon points="7,9.1 7,14.5 2,11.8" fill="white"/>

</svg>
