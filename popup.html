<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unit Converter</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <h1><img src="icons/icon48.png" alt="" class="app-icon" />Unit Converter</h1>

    <div class="category-tabs" role="tablist">
      <button class="tab active" data-category="length" role="tab">Length</button>
      <button class="tab" data-category="weight" role="tab">Weight</button>
      <button class="tab" data-category="temperature" role="tab">Temp</button>
      <button class="tab" data-category="volume" role="tab">Volume</button>
      <button class="tab" data-category="speed" role="tab">Speed</button>
      <button class="tab" data-category="phonetic" role="tab">Phonetic</button>
    </div>

    <div class="converter" id="converter">
      <div class="field">
        <input type="number" id="input-a" placeholder="0" autocomplete="off" />
        <select id="unit-a"></select>
      </div>

      <button class="swap-btn" id="swap-btn" title="Swap units">⇄</button>

      <div class="field">
        <input type="number" id="input-b" placeholder="0" autocomplete="off" />
        <select id="unit-b"></select>
      </div>
    </div>

    <div class="phonetic-panel" id="phonetic-panel">
      <div class="phonetic-input-row">
        <input
          type="text"
          id="phonetic-input"
          placeholder="e.g. FB4XO8"
          maxlength="32"
          autocomplete="off"
          autocapitalize="characters"
          spellcheck="false"
        />
        <span class="phonetic-count" id="phonetic-count">0 / 32</span>
      </div>
      <div class="phonetic-output" id="phonetic-output">
        <p class="phonetic-empty">Type or paste a code to spell it out</p>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
